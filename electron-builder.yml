appId: com.northcodebase.northconnect
productName: NorthConnect

directories:
  output: dist-release

# Files to include in the packaged app
files:
  - dist/**/*
  - package.json

# Bundle native executables and media helpers directly on disk
extraResources:
  - from: bin/
    to: bin
  - from: dist/main/ffmpeg.exe
    to: ffmpeg.exe
  - from: dist/main/yt-dlp.exe
    to: yt-dlp.exe

asarUnpack:
  - "**/*.exe"
  - "**/*.node"
  - "**/*.wasm"
  - "node_modules/ffmpeg-static/**"
  - "node_modules/opusscript/**"
  - "dist/main/ffmpeg.exe"
  - "dist/main/yt-dlp.exe"
  - "dist/main/build/**"

# Windows target configuration
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: resources/icon.ico

# NSIS installer configuration
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NorthConnect
  perMachine: false
  allowElevation: true
  artifactName: ${productName}-Setup-${version}.${ext}

portable:
  artifactName: ${productName}-Portable-${version}.${ext}